name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # setup-uv already provisioned .venv for the requested Python.
        run: uv pip install -r requirements-dev.txt

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy

      - name: Pytest
        run: .venv/bin/python -m pytest tests/ -q

      - name: Validate panel module syntax
        run: node --check custom_components/rainbird_scheduler/frontend/panel.js
